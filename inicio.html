<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GERESA Cusco | Estrategias Sanitarias</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eaf0f7;
  --panel:#101927;
  --panel-2:#162235;
  --panel-3:#1b2940;
  --card:#1a2739;
  --card-2:#203148;
  --primary:#5b6cff;
  --primary-2:#4656e8;
  --accent:#14b8a6;
  --text:#0f172a;
  --muted:#7c8aa2;
  --border:#dbe5f0;
  --shadow:0 10px 30px rgba(15,23,42,.08);
  --shadow-strong:0 20px 60px rgba(15,23,42,.16);
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Sora',sans-serif;
  min-height:100vh;
  color:#fff;
  background:
    radial-gradient(circle at top left, rgba(91,108,255,.12), transparent 25%),
    radial-gradient(circle at top right, rgba(20,184,166,.10), transparent 22%),
    linear-gradient(180deg, #f7fbff 0%, var(--bg) 100%);
}

.main{
  padding:22px;
  min-width:0;
}

.topbar{
  position:sticky;
  top:0;
  z-index:30;
  background:rgba(239,244,251,.88);
  backdrop-filter:blur(14px);
  border:1px solid rgba(219,229,240,.9);
  border-radius:24px;
  padding:16px;
  display:flex;
  gap:12px;
  align-items:center;
  box-shadow:var(--shadow);
}

.filters{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
  flex:0 0 auto;
}

.filter-btn{
  border:none;
  border-radius:999px;
  padding:10px 14px;
  font-family:'Sora',sans-serif;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
  transition:.2s;
  background:#e2e8f0;
  color:#334155;
  white-space:nowrap;
}
.filter-btn:hover,
.filter-btn.active{
  background:linear-gradient(135deg, var(--primary), var(--primary-2));
  color:white;
}

.search{
  flex:1;
  min-width:0;
}
.search input{
  width:100%;
  border:1px solid var(--border);
  background:white;
  border-radius:16px;
  padding:14px 16px;
  outline:none;
  font-size:13px;
  box-shadow:var(--shadow);
}
.search input:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 4px rgba(91,108,255,.12);
}

.top-actions{
  display:flex;
  gap:10px;
  flex-shrink:0;
}
.action-btn{
  border:none;
  border-radius:14px;
  padding:13px 16px;
  font-family:'Sora',sans-serif;
  font-weight:700;
  cursor:pointer;
  transition:.2s;
  white-space:nowrap;
}
.action-primary{
  background:linear-gradient(135deg, var(--primary), var(--primary-2));
  color:white;
}
.action-secondary{
  display:none;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin:22px 0 14px;
  gap:12px;
}
.section-head h3{
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.18em;
  color:#64748b;
}
.section-head span{
  font-size:13px;
  color:#64748b;
}

.modules{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(260px, 1fr));
  gap:14px;
}

.module{
  background:linear-gradient(135deg, rgba(26,39,57,.98), rgba(32,49,72,.98));
  border:1px solid rgba(255,255,255,.05);
  border-radius:18px;
  overflow:hidden;
  display:grid;
  grid-template-rows:180px 1fr auto;
  min-height:320px;
  box-shadow:var(--shadow);
  transition:.22s ease;
}
.module:hover{
  transform:translateY(-4px);
  box-shadow:var(--shadow-strong);
  border-color:rgba(91,108,255,.28);
}

.module-media{
  position:relative;
  overflow:hidden;
  background:#0f172a;
}
.module-media img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.module-media::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(180deg, rgba(11,18,32,.00) 0%, rgba(11,18,32,.18) 100%);
}

.module-content{
  padding:18px 18px 16px;
  min-width:0;
}

.module-title{
  font-family:'DM Serif Display',serif;
  font-size:1.3rem;
  line-height:1.1;
  color:#fff;
  margin-bottom:8px;
}

.module-desc{
  color:rgba(255,255,255,.85);
  font-size:13px;
  line-height:1.55;
  margin-bottom:14px;
  max-width:100%;
}

.module-meta{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.pill{
  font-size:11px;
  padding:7px 10px;
  border-radius:999px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.10);
  color:rgba(255,255,255,.88);
}

.module-actions{
  display:flex;
  gap:10px;
  padding:16px;
  border-top:1px solid rgba(255,255,255,.06);
  background:rgba(0,0,0,.06);
}

.link-btn{
  text-decoration:none;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:12px 12px;
  border-radius:14px;
  font-weight:700;
  font-size:13px;
  transition:.2s;
  flex:1;
}

.btn-manual{
  background:#eef2ff;
  color:#3f4fd8;
}
.btn-manual:hover{
  background:var(--primary);
  color:#fff;
}
.btn-dash{
  background:#0f172a;
  color:#fff;
}
.btn-dash:hover{
  background:#111827;
}

.footer{
  margin-top:22px;
  background:linear-gradient(135deg, #0b1220, #111a30);
  color:rgba(255,255,255,.65);
  border-radius:22px;
  padding:18px 20px;
  font-size:12px;
}

.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.60);
  backdrop-filter:blur(8px);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
  padding:20px;
}
.modal-backdrop.show{display:flex;}
.modal{
  width:min(460px,100%);
  background:white;
  border-radius:28px;
  padding:32px;
  box-shadow:var(--shadow-strong);
  position:relative;
  color:var(--text);
}
.modal-close{
  position:absolute;
  top:16px;
  right:16px;
  width:38px;height:38px;
  border:none;
  border-radius:12px;
  background:#f1f5f9;
  cursor:pointer;
  font-size:22px;
}
.modal small{
  text-transform:uppercase;
  letter-spacing:.15em;
  color:var(--primary);
  font-weight:700;
}
.modal h4{
  font-family:'DM Serif Display',serif;
  font-size:2rem;
  margin:10px 0 8px;
}
.modal p{
  color:var(--muted);
  line-height:1.7;
  margin-bottom:20px;
  font-size:14px;
}
.field{margin-bottom:14px}
.field label{
  display:block;
  margin-bottom:6px;
  font-size:12px;
  color:var(--muted);
  font-weight:600;
}
.field input{
  width:100%;
  border:1px solid var(--border);
  background:#f8fafc;
  border-radius:14px;
  padding:14px;
  outline:none;
}
.field input:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 4px rgba(91,108,255,.10);
}
.modal-actions{
  display:flex;
  gap:10px;
  margin-top:22px;
}
.btn{
  border:none;
  border-radius:14px;
  padding:14px;
  font-family:'Sora',sans-serif;
  font-weight:700;
  cursor:pointer;
}
.btn-cancel{flex:1;background:#e2e8f0}
.btn-enter{flex:2;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:white}

@media(max-width:1100px){
  .modules{
    grid-template-columns:repeat(auto-fit, minmax(240px, 1fr));
  }
}

@media(max-width:900px){
  .topbar{
    flex-direction:column;
    align-items:stretch;
  }
  .filters{
    width:100%;
  }
  .top-actions{
    width:100%;
  }
  .action-primary{
    width:100%;
  }
}

@media(max-width:800px){
  .main{padding:14px}
  .modules{
    grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
  }
  .module{
    grid-template-rows:170px 1fr auto;
  }
  .module-actions{
    flex-direction:column;
  }
}

@media(max-width:520px){
  .filters{
    gap:6px;
  }
  .filter-btn{
    flex:1 1 auto;
  }
}
</style>
</head>

<body>
<main class="main">
  <div class="topbar">
    <div class="filters" id="filtersBar">
      <button class="filter-btn active" data-filter="all">Todas</button>
      <button class="filter-btn" data-filter="prioritarios">Prioritarias</button>
      <button class="filter-btn" data-filter="prevencion">Prevención</button>
      <button class="filter-btn" data-filter="maternoinfantil">Materno infantil</button>
    </div>

    <div class="search">
      <input type="text" id="searchInput" placeholder="Buscar estrategia, dashboard o manual...">
    </div>

    <div class="top-actions">
      <button class="action-btn action-primary" onclick="openModal()">Visualizar</button>
    </div>
  </div>

  <div class="section-head">
    <h3>Radar Regional de Salud</h3>
    <span id="visibleCount">0 Reportes</span>
  </div>

  <div class="modules" id="modulesGrid"></div>

  <div class="footer">
    © 2026 GERESA Cusco — Oficina de Estadística e Informática
  </div>
</main>

<div class="modal-backdrop" id="loginModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">×</button>
    <small>Acceso institucional</small>
    <h4>Plataforma HIS</h4>
    <p>Ingrese sus credenciales institucionales para continuar.</p>

    <div class="field">
      <label>DNI</label>
      <input type="text" id="dni" placeholder="Ingrese su DNI">
    </div>

    <div class="field">
      <label>Contraseña</label>
      <input type="password" id="password" placeholder="Ingrese su contraseña">
    </div>

    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-enter" onclick="loginAction()">Ingresar</button>
    </div>
  </div>
</div>

<script>
const modulesData = [
  {
    title:'Salud Mental',
    group:'prioritarios',
    img:'img/mental2.jpg',
    desc:'⏳ En Proceso...[▓▓▓▓▓▓░░░░░░░░░] 40%'
  },
  {
    title:'Daños No Transmisibles',
    group:'prioritarios',
    img:'img/nt.png',
    desc:'Control y vigilancia de hipertensión, diabetes y factores de riesgo cardiovascular.'
  },
  {
    title:'Salud Ocular',
    group:'prevencion',
    img:'img/ocular.jpg',
    desc:'Prevención, detección y atención oportuna de problemas de la visión.'
  },
  {
    title:'Metales Pesados',
    group:'prioritarios',
    img:'img/metal.png',
    desc:'⏳ En Proceso...[▓▓▓▓▓▓▓▓▓▓▓▓░░░] 75%'
  },
  {
    title:'Salud Bucal',
    group:'prevencion',
    img:'img/bucal.jpg',
    desc:'Atención odontológica integral, prevención y control en salud bucal.'
  },
  {
    title:'Prevención de Cáncer',
    group:'prevencion',
    img:'img/cancer.jpg',
    desc:'⏳ En Proceso...[▓▓░░░░░░░░░░░░░] 10%'
  },
  {
    title:'Salud Materna',
    group:'maternoinfantil',
    img:'img/materna.jpg',
    desc:'⏳ En Proceso...[▓░░░░░░░░░░░░░░] 8%'
  },
  {
    title:'Salud Infantil',
    group:'maternoinfantil',
    img:'img/infantil.jpg',
    desc:'⏳ En Proceso...[▓░░░░░░░░░░░░░░] 8%'
  },
  {
    title:'Alimentación y Nutrición',
    group:'maternoinfantil',
    img:'img/nutricion.jpg',
    desc:'⏳ En Proceso...[▓░░░░░░░░░░░░░░] 8%'
  },
  {
    title:'Tuberculosis',
    group:'prioritarios',
    img:'img/tuberculosis.jpg',
    desc:'⏳ En Proceso...[▓░░░░░░░░░░░░░░] 8%'
  }
];

const manualUrl = 'https://files.minsa.gob.pe/s/74MZgRMddAx7mw2?dir=/2025';
const dashMap = {
  'Salud Bucal':'https://app.powerbi.com/view?r=eyJrIjoiOTNlOWViMzUtNDJiOC00MjRhLWJjZDUtMDNhOGU5MTRmYmQzIiwidCI6ImExMTQxY2VhLWY2NjYtNGUxMS1hNzAzLWQ3MjEzNDBkNjQ0NCIsImMiOjR9&pageName=996064daa29174b68db3',
  'Metales Pesados':'https://app.powerbi.com/view?r=eyJrIjoiMTIzZTM3NmMtNzI4Yy00MDU4LTlkODQtZDY2MzA0YTMwZGUxIiwidCI6ImExMTQxY2VhLWY2NjYtNGUxMS1hNzAzLWQ3MjEzNDBkNjQ0NCIsImMiOjR9'
};
const defaultDash = 'https://app.powerbi.com/view?r=eyJrIjoiOTNlOWViMzUtNDJiOC00MjRhLWJjZDUtMDNhOGU5MTRmYmQzIiwidCI6ImExMTQxY2VhLWY2NjYtNGUxMS1hNzAzLWQ3MjEzNDBkNjQ0NCIsImMiOjR9&pageName=996064daa29174b68db3';

const grid = document.getElementById('modulesGrid');
const searchInput = document.getElementById('searchInput');
const visibleCount = document.getElementById('visibleCount');
const filterButtons = document.querySelectorAll('.filter-btn');
let currentFilter = 'all';

function renderModules(){
  grid.innerHTML = modulesData.map(item => `
    <article class="module" data-group="${item.group}" data-title="${item.title.toLowerCase()}" data-desc="${item.desc.toLowerCase()}">
      <div class="module-media">
        <img src="${item.img}" alt="${item.title}" loading="lazy">
      </div>
      <div class="module-content">
        <div class="module-title">${item.title}</div>
        <div class="module-desc">${item.desc}</div>
        <div class="module-meta">
          <span class="pill">MINSA</span>
          <span class="pill">${item.group}</span>
          <span class="pill">HIS</span>
        </div>
      </div>
      <div class="module-actions">
        <a class="link-btn btn-manual" href="${manualUrl}" target="_blank" rel="noopener noreferrer">Manuales</a>
        <a class="link-btn btn-dash" href="${dashMap[item.title] || defaultDash}" target="_blank" rel="noopener noreferrer">Dashboard</a>
      </div>
    </article>
  `).join('');
  applyFilters();
}

function applyFilters(){
  const q = searchInput.value.toLowerCase().trim();
  const cards = grid.querySelectorAll('.module');

  cards.forEach(card => {
    const matchText = card.dataset.title.includes(q) || card.dataset.desc.includes(q) || card.dataset.group.includes(q);
    const matchGroup = currentFilter === 'all' || card.dataset.group === currentFilter;
    card.style.display = (matchText && matchGroup) ? '' : 'none';
  });

  updateVisibleCount();
}

function updateVisibleCount(){
  const visible = [...grid.querySelectorAll('.module')].filter(el => el.style.display !== 'none').length;
  visibleCount.textContent = `${visible} Reportes`;
}

filterButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    filterButtons.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    applyFilters();
  });
});

searchInput.addEventListener('input', applyFilters);

function openModal(){
  document.getElementById('loginModal').classList.add('show');
  setTimeout(() => document.getElementById('dni').focus(), 100);
}
function closeModal(){
  document.getElementById('loginModal').classList.remove('show');
}

async function loginAction(){
  const dni = document.getElementById("dni").value.trim();
  const password = document.getElementById("password").value.trim();
  if(!dni || !password){
    alert("Ingrese su DNI y contraseña.");
    return;
  }

  const fd = new FormData();
  fd.append("dni", dni);
  fd.append("password", password);

  try{
    const res = await fetch("api/api_validar_usuario.php",{ method:"POST", body:fd });
    const json = await res.json();
    if(json.success){
      localStorage.setItem("nombreusuario", json.nombre || "");
      localStorage.setItem("cargousuario", json.cargo || "");
      localStorage.setItem("dniusuario", dni);
      localStorage.setItem("ueusuario", json.ue || "");
      localStorage.setItem("redusuario", json.red || "");
      localStorage.setItem("microredusuario", json.microred || "");
      localStorage.setItem("eessusuario", json.eess || "");
      window.location.href = "tabla02.html";
    }else{
      alert(json.message);
    }
  }catch(err){
    console.error(err);
    alert("Error de conexión.");
  }
}

document.getElementById('loginModal').addEventListener('click', e => {
  if(e.target.id === 'loginModal') closeModal();
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closeModal();
});

renderModules();
</script>
</body>
</html>
