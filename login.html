<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GERESA CUSCO - Crear Cuenta</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    font-family:'Segoe UI',sans-serif;
    background:
        linear-gradient(rgba(5,15,35,.82),rgba(5,15,35,.88)),
        url('https://images.unsplash.com/photo-1588776814546-ec7e8c0b1f6f?q=80&w=1600&auto=format&fit=crop');
    background-size:cover;
    background-position:center;
}

.main-container{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px;
}

.login-wrapper{
    width:100%;
    max-width:1450px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:60px;
    align-items:center;
}

.left-side{
    color:white;
}

.brand{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:40px;
}

.brand-logo{
    width:70px;
    height:70px;
    border-radius:20px;
    background:#9eff00;
    color:#071426;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
}

.brand-text{
    font-size:55px;
    font-weight:900;
}

.hero-title{
    font-size:90px;
    line-height:.95;
    font-weight:900;
}

.hero-title span{
    color:#9eff00;
}

.form-card{
    backdrop-filter:blur(16px);
    background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.15);
    border-radius:32px;
    padding:42px;
    color:white;
    box-shadow:0 10px 40px rgba(0,0,0,.25);
}

.form-title{
    font-size:42px;
    font-weight:900;
    margin-bottom:8px;
}

.form-subtitle{
    color:#dbe7ff;
    margin-bottom:35px;
}

.form-label{
    font-weight:700;
    margin-bottom:10px;
}

.form-control,
.form-select{
    height:58px;
    border-radius:18px;
    border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.08);
    color:white;
}

.form-control:focus,
.form-select:focus{
    background:rgba(255,255,255,.12);
    color:white;
    border-color:#9eff00;
    box-shadow:0 0 0 4px rgba(158,255,0,.18);
}

.form-control::placeholder{
    color:#dbe7ff;
}

.form-select option{
    color:black;
}

.btn-main{
    width:100%;
    height:62px;
    border:none;
    border-radius:18px;
    background:#9eff00;
    color:#071426;
    font-size:18px;
    font-weight:900;
    margin-top:10px;
    transition: all 0.3s ease;
}

.btn-main:hover{
    background:#b4ff31;
    transform: scale(1.02);
}

.btn-main:disabled{
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
}

.info-box{
    margin-top:12px;
    padding:14px;
    border-radius:16px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);
    color:#dbe7ff;
    display:none;
}

.info-box strong{
    color:#9eff00;
}

.info-box.error{
    border-color: rgba(255,68,68,.3);
    background: rgba(255,68,68,.08);
}

.info-box.error strong{
    color: #ff6b6b;
}

.info-box.success{
    border-color: rgba(158,255,0,.3);
    background: rgba(158,255,0,.08);
}

.info-box.success strong{
    color: #9eff00;
}

.is-invalid{
    border-color: #ff4444 !important;
    box-shadow: 0 0 0 4px rgba(255,68,68,.18) !important;
}

@media(max-width:1200px){
    .login-wrapper{
        grid-template-columns:1fr;
    }
    .hero-title{
        font-size:65px;
    }
    .left-side{
        text-align:center;
    }
    .brand{
        justify-content:center;
    }
}

@media(max-width:768px){
    .main-container{
        padding:20px;
    }
    .hero-title{
        font-size:48px;
    }
    .form-card{
        padding:28px;
    }
    .brand-text{
        font-size:38px;
    }
}
</style>
</head>
<body>

<div class="main-container">
    <div class="login-wrapper">
        <div class="left-side">
            <div class="brand">
                <div class="brand-logo">
                    <i class="bi bi-eye-fill"></i>
                </div>
                <div class="brand-text">GERESA</div>
            </div>
            <div class="hero-title">
                Gestion<br>
                <span>De</span><br>
                Usuario
            </div>
        </div>

        <div class="form-card">
            <div class="form-title">Registro de Usuario</div>
            <div class="form-subtitle">Complete la información requerida.</div>

            <form id="formulario">
                <div class="mb-3">
                    <label class="form-label">DNI</label>
                    <input type="text" id="dni" class="form-control" maxlength="8" placeholder="Ingrese DNI" required autofocus>
                </div>

                <div class="info-box" id="infoPersonal"></div>

                <div class="mb-3">
                    <label class="form-label">Celular</label>
                    <input type="text" id="celular" class="form-control" maxlength="9" placeholder="Ej: 987654321">
                </div>

                <div class="mb-3">
                    <label class="form-label">Correo Electrónico</label>
                    <input type="email" id="correo" class="form-control" placeholder="ejemplo@correo.com">
                </div>

                <div class="mb-3">
                    <label class="form-label">Cargo</label>
                    <select id="cargo" class="form-select" onchange="onCargoChange()" required>
                        <option value="">Seleccione</option>
                        <option value="MONITOR">MONITOR</option>
                        <option value="COORDINADOR">COORDINADOR</option>
                        <option value="GERENTE">GERENTE</option>
                        <option value="DIGITADOR">DIGITADOR</option>
                        <option value="PROFESIONAL">PROFESIONAL</option>
                    </select>
                </div>

                <div class="mb-3 d-none" id="groupUE">
                    <label class="form-label">UE</label>
                    <select id="ue" class="form-select" onchange="onUEChange()">
                        <option value="">Seleccione</option>
                    </select>
                </div>

                <div class="mb-3 d-none" id="groupRED">
                    <label class="form-label">RED</label>
                    <select id="red" class="form-select" onchange="onRedChange()">
                        <option value="">Seleccione</option>
                    </select>
                </div>

                <div class="mb-3 d-none" id="groupMICRORED">
                    <label class="form-label">MICRORED</label>
                    <select id="microred" class="form-select" onchange="onMicroredChange()">
                        <option value="">Seleccione</option>
                    </select>
                </div>

                <div class="mb-3 d-none" id="groupEESS">
                    <label class="form-label">EESS</label>
                    <select id="eess" class="form-select">
                        <option value="">Seleccione</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" id="password" class="form-control" placeholder="Ingrese contraseña" required>
                </div>

                <button type="submit" class="btn-main" id="btnSubmit">
                    <i class="bi bi-person-plus-fill me-2"></i>
                    CREAR CUENTA
                </button>
            </form>
        </div>
    </div>
</div>

<script>
function limpiar(id){
    const sel = document.getElementById(id);
    sel.innerHTML = '<option value="">Seleccione</option>';
}

function getValue(row, keys){
    for (const key of keys){
        const v = row?.[key];
        if (v !== undefined && v !== null && String(v).trim() !== '') {
            return String(v).trim();
        }
    }
    return '';
}

async function validarDNI(){
    const dniInput = document.getElementById("dni");
    const dni = dniInput.value.trim();
    const box = document.getElementById("infoPersonal");
    
    if(dni.length !== 8) {
        box.style.display = 'none';
        return;
    }

    try {
        const res = await fetch("api/api_catalogos.php?" + new URLSearchParams({
            tipo:"SP_VALIDAR_DNI",
            dni:dni
        }));

        const json = await res.json();

        if(json.success && Array.isArray(json.data) && json.data.length > 0){
            box.style.display = "block";
            box.className = "info-box success";
            box.innerHTML = `<strong>✅ Personal encontrado:</strong><br>${json.data[0].Nombre_Completo ?? ''}`;
            dniInput.classList.remove('is-invalid');
        } else {
            box.style.display = "block";
            box.className = "info-box error";
            box.innerHTML = `<strong>❌ DNI no encontrado en PERSONAL</strong>`;
            
            // Limpiar campo DNI y enfocar
            dniInput.value = '';
            dniInput.focus();
            dniInput.classList.add('is-invalid');
            
            setTimeout(() => {
                dniInput.classList.remove('is-invalid');
            }, 3000);
        }
    } catch (error) {
        console.error("Error validando DNI:", error);
        box.style.display = "block";
        box.className = "info-box error";
        box.innerHTML = `<strong>❌ Error al validar DNI</strong>`;
    }
}

document.getElementById("dni").addEventListener("blur", validarDNI);

document.getElementById("dni").addEventListener("input", function(){
    this.classList.remove('is-invalid');
    const box = document.getElementById("infoPersonal");
    box.style.display = "none";
    box.className = "info-box";
});

async function cargarSelect(id, tipo, extra = {}){
    const sel = document.getElementById(id);
    limpiar(id);

    try {
        const res = await fetch("api/api_catalogos.php?" + new URLSearchParams({
            tipo,
            ...extra
        }));

        const json = await res.json();
        const data = Array.isArray(json.data) ? json.data : [];

        data.forEach(r => {
            let value = '';
            let text = '';

            if (tipo === "UE") {
                value = getValue(r, ["NOMBRE"]);
                text  = getValue(r, ["DESCRIPCION"]);
            } else if (tipo === "RED") {
                value = getValue(r, ["NOMBRE"]);
                text  = getValue(r, ["DESCRIPCION"]);
            } else if (tipo === "MICRORED") {
                value = getValue(r, ["NOMBRE"]);
                text  = getValue(r, ["DESCRIPCION"]);
            } else if (tipo === "EESS") {
                value = getValue(r, ["NOMBRE"]);
                text  = getValue(r, ["NOMBRE"]);
            }

            if (!value || !text) return;

            const opt = document.createElement("option");
            opt.value = value;
            opt.textContent = text;
            sel.appendChild(opt);
        });
    } catch (error) {
        console.error("Error cargando select:", error);
    }
}

function ocultarTodo(){
    ["groupUE","groupRED","groupMICRORED","groupEESS"].forEach(id => {
        document.getElementById(id).classList.add("d-none");
    });

    limpiar("ue");
    limpiar("red");
    limpiar("microred");
    limpiar("eess");
}

async function onCargoChange(){
    ocultarTodo();

    const cargo = document.getElementById("cargo").value;

    if(cargo === "COORDINADOR"){
        document.getElementById("groupUE").classList.remove("d-none");
        await cargarSelect("ue","UE");
    }

    if(cargo === "GERENTE" || cargo === "DIGITADOR" || cargo === "PROFESIONAL"){
        document.getElementById("groupUE").classList.remove("d-none");
        document.getElementById("groupRED").classList.remove("d-none");
        await cargarSelect("ue","UE");
    }

    if(cargo === "DIGITADOR" || cargo === "PROFESIONAL"){
        document.getElementById("groupMICRORED").classList.remove("d-none");
    }

    if(cargo === "PROFESIONAL"){
        document.getElementById("groupEESS").classList.remove("d-none");
    }
}

async function onUEChange(){
    limpiar("red");
    limpiar("microred");
    limpiar("eess");

    const ue = document.getElementById("ue").value;
    if(!ue) return;

    await cargarSelect("red","RED",{ ue });
}

async function onRedChange(){
    limpiar("microred");
    limpiar("eess");

    const ue = document.getElementById("ue").value;
    const red = document.getElementById("red").value;
    if(!red) return;

    await cargarSelect("microred","MICRORED",{ ue, red });
}

async function onMicroredChange(){
    limpiar("eess");

    const cargo = document.getElementById("cargo").value;
    const ue = document.getElementById("ue").value;
    const red = document.getElementById("red").value;
    const microred = document.getElementById("microred").value;

    if(cargo !== "PROFESIONAL") return;

    await cargarSelect("eess","EESS",{ ue, red, microred });
}

document.getElementById("formulario").addEventListener("submit", async function(e){
    e.preventDefault();

    const btnSubmit = document.getElementById("btnSubmit");
    btnSubmit.disabled = true;
    btnSubmit.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> PROCESANDO...';

    try {
        const fd = new FormData();
        fd.append("dni", document.getElementById("dni").value);
        fd.append("cargo", document.getElementById("cargo").value);
        fd.append("ue", document.getElementById("ue").value);
        fd.append("red", document.getElementById("red").value);
        fd.append("microred", document.getElementById("microred").value);
        fd.append("eess", document.getElementById("eess").value);
        fd.append("password", document.getElementById("password").value);
        fd.append("celular", document.getElementById("celular").value);
        fd.append("correo", document.getElementById("correo").value);

        const res = await fetch("login.php", {
            method: "POST",
            body: fd
        });

        // Verificar si la respuesta es JSON
        const contentType = res.headers.get("content-type");
        if (!contentType || !contentType.includes("application/json")) {
            const text = await res.text();
            console.error("Respuesta no JSON:", text);
            alert("Error del servidor. Revisa la consola para más detalles.");
            return;
        }

        const json = await res.json();
        
        // Mostrar mensaje
        if (json.success) {
            alert("✅ " + json.message);
            document.getElementById("formulario").reset();
            ocultarTodo();
            document.getElementById("infoPersonal").style.display = "none";
            document.getElementById("infoPersonal").className = "info-box";
            document.getElementById("dni").focus();
        } else {
            alert("❌ " + json.message);
            if (json.debug) {
                console.error("Debug:", json.debug);
            }
        }
    } catch (error) {
        console.error("Error en la petición:", error);
        alert("❌ Error al conectar con el servidor");
    } finally {
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = '<i class="bi bi-person-plus-fill me-2"></i> CREAR CUENTA';
    }
});
</script>

</body>
</html>
