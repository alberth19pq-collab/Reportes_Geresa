<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GERESA Cusco · Acceso Institucional</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary: #3b82f6;
      --primary-dark: #2563eb;
      --primary-light: #eff6ff;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --white: #ffffff;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --text-light: #94a3b8;
      --border: #e2e8f0;
      --shadow: 0 1px 3px rgba(0,0,0,0.04);
      --shadow-lg: 0 8px 30px rgba(0,0,0,0.12);
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }

    .card {
      max-width: 920px;
      width: 100%;
      background: var(--surface);
      border-radius: 28px;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: row;
      min-height: 540px;
    }

    /* ============================================
       COLUMNA IZQUIERDA - ENCABEZADO INSTITUCIONAL
       ============================================ */
    .left-column {
      width: 38%;
      background: linear-gradient(180deg, #0a0f1c 0%, #0f172a 100%);
      padding: 40px 30px 40px 34px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }

    .left-column::after {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 1px;
      background: rgba(255,255,255,0.06);
    }

    /* Decoración de fondo */
    .left-column::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -30%;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: rgba(59, 130, 246, 0.04);
      pointer-events: none;
    }

    .left-content {
      position: relative;
      z-index: 1;
    }

    .left-tag {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #93c5fd;
      background: rgba(59, 130, 246, 0.15);
      padding: 4px 14px;
      border-radius: 100px;
      display: inline-block;
      margin-bottom: 16px;
      font-family: 'Inter', sans-serif;
    }

    .left-title {
      font-family: 'Inter', sans-serif;
      font-weight: 800;
      font-size: 2rem;
      color: #ffffff;
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .left-sub {
      font-size: 13px;
      color: #94a3b8;
      font-weight: 500;
      border-left: 3px solid var(--primary);
      padding-left: 14px;
      margin-bottom: 20px;
    }
    .left-sub b {
      color: #e2e8f0;
      font-weight: 600;
    }

    .left-stamp {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 2px dashed rgba(239, 68, 68, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      transform: rotate(-6deg);
      opacity: 0.9;
      position: relative;
      margin-bottom: 24px;
    }
    .left-stamp::before {
      content: '';
      position: absolute;
      inset: 7px;
      border: 1px dashed rgba(239, 68, 68, 0.5);
      border-radius: 50%;
      opacity: 0.6;
    }
    .left-stamp .stamp-text {
      font-size: 9px;
      font-weight: 700;
      text-align: center;
      line-height: 1.3;
      letter-spacing: 0.04em;
      color: #fca5a5;
      font-family: 'Inter', sans-serif;
      text-transform: uppercase;
    }

    /* Separador visual */
    .left-divider {
      width: 40px;
      height: 2px;
      background: var(--primary);
      margin: 0 0 18px 0;
      border-radius: 4px;
    }

    .left-info-title {
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .left-info-desc {
      font-size: 12.5px;
      color: #94a3b8;
      line-height: 1.5;
      max-width: 280px;
    }

    /* ============================================
       COLUMNA DERECHA - FORMULARIO
       ============================================ */
    .right-column {
      width: 62%;
      padding: 34px 34px 30px 30px;
      display: flex;
      flex-direction: column;
      background: var(--surface);
    }

    .folder-tab {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom: none;
      border-radius: 12px 12px 0 0;
      padding: 8px 16px 7px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text);
      box-shadow: 0 -4px 12px rgba(15, 23, 42, 0.04);
      position: relative;
      width: fit-content;
      margin-top: 0;
      font-family: 'Inter', sans-serif;
    }
    .folder-tab::before {
      content: '';
      position: absolute;
      top: -1px;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--primary);
      border-radius: 12px 12px 0 0;
    }

    .form-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0 12px 12px 12px;
      padding: 22px 24px 24px;
      box-shadow: var(--shadow);
      flex: 1;
    }

    .form-panel .title {
      font-family: 'Inter', sans-serif;
      font-weight: 800;
      font-size: 1.25rem;
      color: var(--text);
      margin-bottom: 2px;
    }
    .form-panel .desc {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 18px;
      border-left: 3px solid var(--danger);
      padding-left: 12px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .field-row {
      display: flex;
      gap: 14px;
    }

    .field-row .field {
      flex: 1;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .field label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'Inter', sans-serif;
    }

    .field label i {
      font-size: 13px;
      color: var(--primary);
    }

    .field input,
    .field select {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      background: var(--surface);
      color: var(--text);
      transition: 0.2s;
      height: 42px;
      outline: none;
    }

    .field input:focus,
    .field select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.08);
    }

    .field input.is-invalid {
      border-color: var(--danger) !important;
      box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.08) !important;
    }

    .info-box {
      padding: 10px 14px;
      border-radius: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-muted);
      display: none;
      margin: 2px 0 4px;
    }
    .info-box strong {
      font-weight: 600;
      color: var(--text);
      font-size: 11px;
      font-family: 'Inter', sans-serif;
    }
    .info-box.success {
      border-color: var(--success);
      background: rgba(34, 197, 94, 0.06);
    }
    .info-box.success strong { color: var(--success); }
    .info-box.error {
      border-color: var(--danger);
      background: rgba(239, 68, 68, 0.06);
    }
    .info-box.error strong { color: var(--danger); }

    .btn-main {
      width: 100%;
      height: 46px;
      border: none;
      border-radius: 12px;
      background: var(--primary);
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: 0.18s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 4px;
    }
    .btn-main:hover { background: var(--primary-dark); }
    .btn-main:disabled { opacity: 0.6; cursor: not-allowed; }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 4px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      text-decoration: none;
      border-bottom: 1px dashed var(--border);
      padding-bottom: 3px;
      width: fit-content;
      transition: 0.2s;
      font-family: 'Inter', sans-serif;
    }
    .back-link:hover { color: var(--danger); border-color: var(--danger); }

    .footer-note {
      margin-top: 16px;
      text-align: center;
      font-size: 9px;
      letter-spacing: 0.03em;
      color: var(--text-light);
      font-weight: 500;
      border-top: 1px solid var(--border);
      padding-top: 14px;
      font-family: 'Inter', sans-serif;
    }
    .footer-note i { color: var(--danger); margin: 0 4px; }

    .d-none { display: none !important; }

    /* ============================================
       RESPONSIVE
       ============================================ */
    @media (max-width: 820px) {
      .card {
        flex-direction: column;
        max-width: 540px;
        min-height: auto;
      }
      .left-column {
        width: 100%;
        padding: 28px 24px 20px;
        border-radius: 28px 28px 0 0;
      }
      .left-column::after {
        display: none;
      }
      .left-column::before {
        display: none;
      }
      .left-title { font-size: 1.6rem; }
      .left-info-desc { max-width: 100%; }
      .right-column {
        width: 100%;
        padding: 20px 20px 24px;
      }
      .form-panel { padding: 18px 16px 20px; }
      .field-row { flex-direction: column; gap: 12px; }
    }

    @media (max-width: 480px) {
      body { padding: 12px; }
      .left-column { padding: 20px 18px 16px; }
      .left-title { font-size: 1.3rem; }
      .left-stamp { width: 64px; height: 64px; }
      .left-stamp .stamp-text { font-size: 7.5px; }
      .right-column { padding: 14px 14px 18px; }
      .form-panel { padding: 14px 12px 16px; }
      .field input, .field select { height: 38px; font-size: 12px; padding: 8px 12px; }
      .btn-main { height: 40px; font-size: 12px; }
    }
  </style>
</head>
<body>

  <!-- ==========================================
  PROTECCIÓN DE ACCESO - SOLO ADMINISTRADORES
  ========================================== -->
  <script>
    (function() {
      const adminLogged = localStorage.getItem('admin_logged');
      
      // Si no hay sesión de administrador activa, redirigir a admin.html
      if (adminLogged !== 'true') {
        window.location.href = 'administrador';
        return;
      }

      // Verificar que la sesión no haya expirado (8 horas)
      const loginTime = localStorage.getItem('admin_login_time');
      if (loginTime) {
        const elapsed = (new Date().getTime() - new Date(loginTime).getTime()) / (1000 * 60 * 60);
        if (elapsed > 8) {
          // Sesión expirada
          localStorage.removeItem('admin_logged');
          localStorage.removeItem('admin_user');
          localStorage.removeItem('admin_login_time');
          window.location.href = 'administrador';
          return;
        }
      }
    })();
  </script>

  <!-- ==========================================
  CONTENIDO PRINCIPAL
  ========================================== -->
  <div class="card">

    <!-- ==========================================
    COLUMNA IZQUIERDA
    ========================================== -->
    <div class="left-column">
      <div class="left-content">
        <div class="left-tag"><i class="bi bi-shield-check"></i> institucional</div>
        <h1 class="left-title">Plataforma Operacional</h1>
        <div class="left-sub">GERESA Cusco · <b>Dirección de Estadística</b></div>

        <div class="left-stamp">
          <div class="stamp-text">OFICINA<br>DE<br>★ ESTADISTICA</div>
        </div>

        <div class="left-divider"></div>

        <div class="left-info-desc">Complete la información requerida para habilitar su acceso a la Plataforma HIS.</div>
      </div>
    </div>

    <!-- ==========================================
    COLUMNA DERECHA - FORMULARIO
    ========================================== -->
    <div class="right-column">

      <div class="folder-tab"><i class="bi bi-file-earmark-text"></i> Nuevo expediente</div>

      <div class="form-panel">
        <div class="title">Crear cuenta</div>

        <form id="formulario">
          <div class="field-group">

            <div class="field">
              <label><i class="bi bi-person-badge"></i> DNI</label>
              <input type="text" id="dni" maxlength="8" placeholder="Ingrese su DNI" required autofocus>
            </div>
            <div class="info-box" id="infoPersonal"></div>

            <!-- Celular y Correo en misma fila -->
            <div class="field-row">
              <div class="field">
                <label><i class="bi bi-phone"></i> Celular</label>
                <input type="text" id="celular" maxlength="9" placeholder="Ej: 987654321">
              </div>
              <div class="field">
                <label><i class="bi bi-envelope"></i> Correo electrónico</label>
                <input type="email" id="correo" placeholder="ejemplo@correo.com">
              </div>
            </div>

            <div class="field">
              <label><i class="bi bi-briefcase"></i> Cargo</label>
              <select id="cargo" onchange="onCargoChange()" required>
                <option value="">Seleccione</option>
                <option value="MONITOR">MONITOR</option>
                <option value="COORDINADOR">COORDINADOR</option>
                <option value="GERENTE">GERENTE</option>
                <option value="DIGITADOR">DIGITADOR</option>
                <option value="PROFESIONAL">PROFESIONAL</option>
              </select>
            </div>

            <div class="field d-none" id="groupUE">
              <label><i class="bi bi-diagram-3"></i> UE</label>
              <select id="ue" onchange="onUEChange()"><option value="">Seleccione</option></select>
            </div>
            <div class="field d-none" id="groupRED">
              <label><i class="bi bi-diagram-2"></i> RED</label>
              <select id="red" onchange="onRedChange()"><option value="">Seleccione</option></select>
            </div>
            <div class="field d-none" id="groupMICRORED">
              <label><i class="bi bi-diagram-2"></i> MICRORED</label>
              <select id="microred" onchange="onMicroredChange()"><option value="">Seleccione</option></select>
            </div>
            <div class="field d-none" id="groupEESS">
              <label><i class="bi bi-hospital"></i> EESS</label>
              <select id="eess"><option value="">Seleccione</option></select>
            </div>

            <div class="field">
              <label><i class="bi bi-lock"></i> Contraseña</label>
              <input type="password" id="password" placeholder="Ingrese su contraseña" required>
            </div>

            <div class="actions">
              <button type="submit" class="btn-main" id="btnSubmit">
                <i class="bi bi-person-plus-fill"></i> Crear cuenta
              </button>
              <div style="display: flex; justify-content: flex-start; align-items: center; gap: 8px;">
                <a href="administrador" class="back-link" style="color:var(--danger);border-color:var(--danger);">
                  <i class="bi bi-box-arrow-right"></i> Cerrar sesión
                </a>
              </div>
            </div>
          </div>
        </form>
      </div>

      <div class="footer-note">
        <i class="bi bi-dot"></i> GERESA Cusco — Oficina de Estadística e Informática <i class="bi bi-dot"></i>
      </div>
    </div>

  </div>

  <script>
    // ============================================================
    //  FUNCIONES DEL FORMULARIO
    // ============================================================

    function limpiar(id) {
      const sel = document.getElementById(id);
      sel.innerHTML = '<option value="">Seleccione</option>';
    }

    function getValue(row, keys) {
      for (const key of keys) {
        const v = row?.[key];
        if (v !== undefined && v !== null && String(v).trim() !== '') {
          return String(v).trim();
        }
      }
      return '';
    }

    async function validarDNI() {
      const dniInput = document.getElementById("dni");
      const dni = dniInput.value.trim();
      const box = document.getElementById("infoPersonal");

      if (dni.length !== 8) {
        box.style.display = 'none';
        return;
      }

      try {
        const res = await fetch("api/api_catalogos.php?" + new URLSearchParams({
          tipo: "SP_VALIDAR_DNI",
          dni: dni
        }));
        const json = await res.json();

        if (json.success && Array.isArray(json.data) && json.data.length > 0) {
          box.style.display = "block";
          box.className = "info-box success";
          box.innerHTML = `<strong>✔ PERSONAL ENCONTRADO</strong><br>${json.data[0].Nombre_Completo ?? ''}`;
          dniInput.classList.remove('is-invalid');
        } else {
          box.style.display = "block";
          box.className = "info-box error";
          box.innerHTML = `<strong>✕ DNI NO ENCONTRADO</strong><br>No figura en el registro de PERSONAL.`;
          dniInput.value = '';
          dniInput.focus();
          dniInput.classList.add('is-invalid');
          setTimeout(() => dniInput.classList.remove('is-invalid'), 3000);
        }
      } catch (error) {
        console.error("Error validando DNI:", error);
        box.style.display = "block";
        box.className = "info-box error";
        box.innerHTML = `<strong>✕ ERROR AL VALIDAR DNI</strong>`;
      }
    }

    document.getElementById("dni").addEventListener("blur", validarDNI);
    document.getElementById("dni").addEventListener("input", function() {
      this.classList.remove('is-invalid');
      const box = document.getElementById("infoPersonal");
      box.style.display = "none";
      box.className = "info-box";
    });

    async function cargarSelect(id, tipo, extra = {}) {
      const sel = document.getElementById(id);
      limpiar(id);
      try {
        const res = await fetch("api/api_catalogos.php?" + new URLSearchParams({ tipo, ...extra }));
        const json = await res.json();
        const data = Array.isArray(json.data) ? json.data : [];

        data.forEach(r => {
          let value = '', text = '';
          if (tipo === "UE") { value = getValue(r, ["NOMBRE"]); text = getValue(r, ["DESCRIPCION"]); }
          else if (tipo === "RED") { value = getValue(r, ["NOMBRE"]); text = getValue(r, ["DESCRIPCION"]); }
          else if (tipo === "MICRORED") { value = getValue(r, ["NOMBRE"]); text = getValue(r, ["DESCRIPCION"]); }
          else if (tipo === "EESS") { value = getValue(r, ["NOMBRE"]); text = getValue(r, ["NOMBRE"]); }
          if (!value || !text) return;
          const opt = document.createElement("option");
          opt.value = value;
          opt.textContent = text;
          sel.appendChild(opt);
        });
      } catch (error) {
        console.error("Error cargando select:", error);
      }
    }

    function ocultarTodo() {
      ["groupUE","groupRED","groupMICRORED","groupEESS"].forEach(id => {
        document.getElementById(id).classList.add("d-none");
      });
      limpiar("ue");
      limpiar("red");
      limpiar("microred");
      limpiar("eess");
    }

    async function onCargoChange() {
      ocultarTodo();
      const cargo = document.getElementById("cargo").value;

      if (cargo === "COORDINADOR") {
        document.getElementById("groupUE").classList.remove("d-none");
        await cargarSelect("ue","UE");
      }
      if (cargo === "GERENTE" || cargo === "DIGITADOR" || cargo === "PROFESIONAL") {
        document.getElementById("groupUE").classList.remove("d-none");
        document.getElementById("groupRED").classList.remove("d-none");
        await cargarSelect("ue","UE");
      }
      if (cargo === "DIGITADOR" || cargo === "PROFESIONAL") {
        document.getElementById("groupMICRORED").classList.remove("d-none");
      }
      if (cargo === "PROFESIONAL") {
        document.getElementById("groupEESS").classList.remove("d-none");
      }
    }

    async function onUEChange() {
      limpiar("red"); limpiar("microred"); limpiar("eess");
      const ue = document.getElementById("ue").value;
      if (!ue) return;
      await cargarSelect("red","RED",{ ue });
    }

    async function onRedChange() {
      limpiar("microred"); limpiar("eess");
      const ue = document.getElementById("ue").value;
      const red = document.getElementById("red").value;
      if (!red) return;
      await cargarSelect("microred","MICRORED",{ ue, red });
    }

    async function onMicroredChange() {
      limpiar("eess");
      const cargo = document.getElementById("cargo").value;
      if (cargo !== "PROFESIONAL") return;
      const ue = document.getElementById("ue").value;
      const red = document.getElementById("red").value;
      const microred = document.getElementById("microred").value;
      await cargarSelect("eess","EESS",{ ue, red, microred });
    }

    // ============================================================
    //  ENVÍO DEL FORMULARIO
    // ============================================================
    document.getElementById("formulario").addEventListener("submit", async function(e) {
      e.preventDefault();
      const btn = document.getElementById("btnSubmit");
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Procesando...';

      try {
        const fd = new FormData();
        fd.append("dni", document.getElementById("dni").value);
        fd.append("cargo", document.getElementById("cargo").value);
        fd.append("ue", document.getElementById("ue").value);
        fd.append("red", document.getElementById("red").value);
        fd.append("microred", document.getElementById("microred").value);
        fd.append("eess", document.getElementById("eess").value);
        fd.append("password", document.getElementById("password").value);
        fd.append("celular", document.getElementById("celular").value);
        fd.append("correo", document.getElementById("correo").value);

        const res = await fetch("login.php", { method: "POST", body: fd });
        const contentType = res.headers.get("content-type");
        if (!contentType || !contentType.includes("application/json")) {
          const text = await res.text();
          console.error("Respuesta no JSON:", text);
          alert("Error del servidor. Revisa la consola.");
          return;
        }
        const json = await res.json();
        if (json.success) {
          alert("✅ " + json.message);
          document.getElementById("formulario").reset();
          ocultarTodo();
          document.getElementById("infoPersonal").style.display = "none";
          document.getElementById("infoPersonal").className = "info-box";
          document.getElementById("dni").focus();
        } else {
          alert("❌ " + json.message);
          if (json.debug) console.error("Debug:", json.debug);
        }
      } catch (error) {
        console.error("Error:", error);
        alert("❌ Error al conectar con el servidor");
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-person-plus-fill"></i> Crear cuenta';
      }
    });

    // ============================================================
    //  CERRAR SESIÓN ADMIN
    // ============================================================
    // Función para cerrar sesión (se llama desde el enlace "Cerrar sesión")
    document.querySelector('a[href="administrador"]')?.addEventListener('click', function(e) {
      // No prevenimos el evento, solo limpiamos antes de redirigir
      localStorage.removeItem('admin_logged');
      localStorage.removeItem('admin_user');
      localStorage.removeItem('admin_login_time');
    });
  </script>
</body>
</html>
